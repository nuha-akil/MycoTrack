name: mycotrack
description: "MycoTrack - Skin Disease Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  image_picker: ^1.2.0
  pinput: ^5.0.1
  intl: ^0.20.2
  http: ^1.1.0
  camera: ^0.11.0
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/skin_image.jpeg
